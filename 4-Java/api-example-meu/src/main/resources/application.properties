spring.application.name=api-example

spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

security.jwt.secret=${SECURITY_JWT_SECRET: 1234567890123456789012}
security.jwt.expiration=${SECURITY_JWT_EXPIRATION_MILLIS: 86400000}

